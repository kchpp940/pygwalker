name: PyGWalker Cross-Platform CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  frontend-build-verify:
    name: Frontend: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      frontend_status: ${{ steps.frontend-result.outputs.status }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: ./app/yarn.lock
      
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ./app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install frontend dependencies
        working-directory: ./app
        run: yarn install --frozen-lockfile
      
      - name: TypeScript Type Check
        working-directory: ./app
        id: typecheck
        run: |
          echo "::group::TypeScript Type Check"
          yarn typecheck
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Build frontend
        working-directory: ./app
        id: build
        run: |
          echo "::group::Frontend Build"
          yarn build
          echo "::endgroup::"
      
      - name: Frontend Verification Scripts
        working-directory: ./app
        id: verify-scripts
        run: |
          echo "::group::Frontend Verification Scripts"
          yarn verify:all
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: pygwalker-app
          path: ./pygwalker/templates/dist/*
          retention-days: 7
      
      - name: Frontend Status Summary
        id: frontend-result
        run: |
          echo "### Frontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "- ✅ Build: Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Build: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.typecheck.outcome }}" == "success" ]; then
            echo "- ✅ TypeScript Type Check: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ TypeScript Type Check: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.verify-scripts.outcome }}" == "success" ]; then
            echo "- ✅ Verification Scripts: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Verification Scripts: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.typecheck.outcome }}" == "success" ] && \
             [ "${{ steps.verify-scripts.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      - name: Fail on frontend errors
        if: steps.typecheck.outcome != 'success' || steps.verify-scripts.outcome != 'success'
        run: |
          echo "::error::Frontend build or verification failed"
          exit 1

  python-tests:
    name: Python: ${{ matrix.test-group }} (${{ matrix.os }}, Py${{ matrix.python-version }})
    needs: frontend-build-verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
        test-group: ['core', 'integration']
        exclude:
          - os: windows-latest
            test-group: integration
          - os: macos-latest
            test-group: integration
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: pygwalker-app
          path: ./pygwalker/templates/dist
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.pythonLocation }}/lib/python*/site-packages
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Install Python package
        env:
          PIP_ONLY_BINARY: "duckdb"
        run: |
          python -m pip install --upgrade pip
          pip install ".[export]"
      
      - name: Download test data
        run: python ./scripts/test-init.py
      
      - name: Install test dependencies
        run: pip install pytest ipykernel nbconvert pandas polars duckdb_engine
      
      - name: Install notebook dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m ipykernel install --name python --user
          jupyter kernelspec list
      
      - name: Run Notebook Tests (Linux, core group only)
        if: runner.os == 'Linux' && matrix.test-group == 'core'
        working-directory: ./tests
        id: notebook-tests
        run: |
          echo "::group::Notebook Tests"
          jupyter nbconvert --execute --ExecutePreprocessor.kernel_name=python --to html *.ipynb
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Run Pytest - ${{ matrix.test-group }} tests
        id: pytest
        run: |
          echo "::group::Pytest (${{ matrix.test-group }})"
          python scripts/run_pytest_groups.py --group ${{ matrix.test-group }}
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Upload notebook artifacts (Linux, Python 3.12, core)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.test-group == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            ./tests/main.html
            ./tests/*.html
          retention-days: 7
      
      - name: Python Test Summary
        run: |
          echo "### Python Test Summary (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.test-group }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package Installation: Success" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.pytest.outcome }}" == "success" ]; then
            echo "- ✅ ${{ matrix.test-group }} Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ ${{ matrix.test-group }} Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ runner.os }}" == "Linux" ] && [ "${{ matrix.test-group }}" == "core" ]; then
            if [ "${{ steps.notebook-tests.outcome }}" == "success" ]; then
              echo "- ✅ Notebook Tests: Passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ Notebook Tests: Failed (may be flaky)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail on critical Python errors
        if: matrix.test-group == 'core' && steps.pytest.outcome != 'success'
        run: |
          echo "::error::Python core tests failed (${{ matrix.os }}, Python ${{ matrix.python-version }})"
          exit 1

  ci-result:
    name: CI Result Summary
    needs: [frontend-build-verify, python-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Overall Status
        run: |
          echo "# PyGWalker CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Frontend" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.frontend-build-verify.result }}" == "success" ]; then
            echo "✅ Frontend build and verification: **Success**" >> $GITHUB_STEP_SUMMARY
            echo "  - Build: ✅" >> $GITHUB_STEP_SUMMARY
            echo "  - TypeScript: ✅" >> $GITHUB_STEP_SUMMARY
            echo "  - Verification Scripts: ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Frontend build and verification: **Failed**" >> $GITHUB_STEP_SUMMARY
            echo "  - Check the 'Frontend: Build & Verify' job for details" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Python Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.python-tests.result }}" == "success" ]; then
            echo "✅ All Python tests: **Success**" >> $GITHUB_STEP_SUMMARY
            echo "  - Core tests: ✅" >> $GITHUB_STEP_SUMMARY
            echo "  - Integration tests: ✅" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.python-tests.result }}" == "failure" ]; then
            echo "❌ Python tests: **Failed**" >> $GITHUB_STEP_SUMMARY
            echo "  - Check individual Python jobs for details" >> $GITHUB_STEP_SUMMARY
            echo "  - Core tests are required to pass" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Python tests: **${{ needs.python-tests.result }}**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## How to Reproduce Locally" >> $GITHUB_STEP_SUMMARY
          echo "To run the same checks locally, use:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'chmod +x scripts/local-ci.sh' >> $GITHUB_STEP_SUMMARY
          echo './scripts/local-ci.sh' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "For detailed results, check the individual job outputs above." >> $GITHUB_STEP_SUMMARY
      
      - name: Final Check
        if: needs.frontend-build-verify.result != 'success' || needs.python-tests.result != 'success'
        run: |
          echo "::error::CI pipeline failed - check the job details for specific failures"
          exit 1
